name: MACD Alert

on:
  workflow_dispatch:
  schedule:
    - cron: '53 3,7,11,15,19,23 * * *'   # за 7 мин до закрытия 4h-свечи (00,04,08... UTC)
    - cron: '9 0,4,8,12,16,20 * * *'     # догоняющий, через 9 мин после закрытия

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: pip install --quiet yfinance pandas

      - name: Проверка MACD и отправка email
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python macd_alert.py

      - name: Сохранить state.json в репозиторий
        run: |
          git config user.name "macd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            git diff --cached --quiet && echo "state не менялся" || {
              git commit -m "state update [skip ci]"
              git push
            }
          fi
