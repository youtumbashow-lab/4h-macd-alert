name: MACD Alert

on:
  workflow_dispatch:          # ручной запуск (и вызов через cron-job.org)
  # schedule:
  #   - cron: '1 */4 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: pip install --quiet requests pandas

      # 1. Твой старый MACD алерт
      - name: Проверка MACD и отправка email
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python macd_alert.py

      # 2. НОВОЕ: Запуск бота пробоя (дневной)
      - name: Запуск основного бота (bot.py)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python bot.py

      # 3. НОВОЕ: Запуск H1-бота
      - name: Запуск H1-бота (h1_bot.py)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python h1_bot.py

      # 4. Сохранение всех состояний
      - name: Сохранить состояния в репозиторий
        if: always()
        run: |
          git config user.name "macd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Добавляем все файлы состояний, если они есть
          git add state.json bot_state.json h1_bot_state.json 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "state update [skip ci]"
            git push
          fi
