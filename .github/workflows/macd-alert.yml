name: MACD Alert

on:
  workflow_dispatch:          # ручной запуск (и вызов через cron-job.org)

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: pip install --quiet requests pandas

      # 1. Запуск основного бота пробоя (bot.py)
      - name: Запуск основного бота (bot.py)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python bot.py

      # 2. Запуск H1-бота (h1_bot.py)
      - name: Запуск H1-бота (h1_bot.py)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python h1_bot.py

      # 3. Сохранение состояний
      - name: Сохранить состояния в репозиторий
        if: always()
        run: |
          git config user.name "macd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Сохраняем только стейты ботов (state.json от macd_alert больше не нужен)
          git add bot_state.json h1_bot_state.json 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "state update [skip ci]"
            git push
          fi
