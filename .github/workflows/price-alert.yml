name: Breakout Bot

on:
  schedule:
    # Запуск через 1 минуту после закрытия 4h-свечи (00:01, 04:01, ...)
    - cron: '1 0,4,8,12,16,20 * * *'
  workflow_dispatch: {}   # Ручной запуск для теста

permissions:
  contents: write

concurrency:
  group: breakout-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: pip install --quiet requests

      - name: Запуск бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "breakout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_state.json || true
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "bot state [skip ci]"
            git push
          fi
