name: Price Alert

on:
  schedule:
    - cron: '30 3,7,11,15,19,23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: pip install --quiet -r requirements.txt

      - name: Проверка цен и отправка email
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python price_alert.py

      - name: Сохранить price_state.json / price_config.json
        if: always()
        run: |
          git config user.name "price-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price_state.json price_config.json || true
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "price alert state [skip ci]"
            git push
          fi
