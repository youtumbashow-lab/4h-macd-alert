name: On-Chain Scanner

on:
  workflow_dispatch:    # Ручной запуск

permissions:
  contents: write       # Важно: разрешает запись файлов

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Важно: скачиваем всю историю для корректного rebase

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scanner
        run: python scanner.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json history.json wallets_history.json
          
          # Если нет изменений, просто выходим
          git commit -m "Update stats and history" || exit 0
          
          # Подтягиваем свежие изменения от других ботов, если они были
          git pull --rebase origin main
          
          # Отправляем свои данные
          git push
