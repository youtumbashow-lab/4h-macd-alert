<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breakout Bot Dashboard</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #131722; color: #d1d4dc; margin: 0; padding: 1rem; }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 1.5rem; color: #fff; margin-bottom: 1rem; }
  
  .card { background: #1e222d; border: 1px solid #2a2e39; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
  .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  
  button { padding: 0.6rem 1.2rem; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .btn-on { background: #089981; color: #fff; }
  .btn-on:hover { background: #067a66; }
  .btn-off { background: #f23645; color: #fff; }
  .btn-off:hover { background: #c42b38; }
  .btn-disabled { opacity: 0.5; cursor: not-allowed; }
  
  .status-badge { padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
  .status-active { background: #08998133; color: #089981; border: 1px solid #089981; }
  .status-inactive { background: #f2364533; color: #f23645; border: 1px solid #f23645; }
  .status-waiting { background: #f7a60033; color: #f7a600; border: 1px solid #f7a600; }
  
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
  .info-item { background: #131722; padding: 0.8rem; border-radius: 4px; border: 1px solid #2a2e39; }
  .info-label { font-size: 0.8rem; color: #787b86; margin-bottom: 0.3rem; }
  .info-value { font-size: 1.1rem; font-weight: 600; color: #fff; }

  #tv_chart_container { height: 600px; width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid #2a2e39; }
  
  .token-area { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .token-area input { flex: 1; padding: 0.5rem; border-radius: 4px; border: 1px solid #2a2e39; background: #131722; color: #d1d4dc; }
  
  .muted { color: #787b86; font-size: 0.9rem; }
  .err { color: #f23645; }
  .ok { color: #089981; }
</style>
</head>
<body>

<div class="container">
  <h1>Breakout Bot Dashboard (4H)</h1>

  <!-- Блок управления -->
  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <div class="row">
        <span style="font-size: 1.1rem; font-weight: 600;">Статус бота:</span>
        <span id="botStatusBadge" class="status-badge status-inactive">Загрузка...</span>
      </div>
      <div class="row">
        <button id="btnEnable" class="btn-on" onclick="setBotState(true)">Включить бота</button>
        <button id="btnDisable" class="btn-off" onclick="setBotState(false)">Отключить бота</button>
      </div>
    </div>
    
    <div id="botInfo" style="display: none; margin-top: 1rem;">
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">Текущий статус</div>
          <div class="info-value" id="infoState">-</div>
        </div>
        <div class="info-item" id="triggerInfo" style="display: none;">
          <div class="info-label">Уровень (Хай триггера)</div>
          <div class="info-value" id="infoLevel">-</div>
        </div>
      </div>
      
      <h3 style="margin-top: 1.5rem; font-size: 1rem; color: #fff;">Активные сделки:</h3>
      <div id="activeTradesList" class="muted">Нет активных сделок</div>
    </div>
    
    <div class="token-area">
      <input id="token" type="password" placeholder="Fine-grained PAT (Contents: Read and write)">
      <button onclick="saveToken()" class="btn-on" style="padding: 0.5rem 1rem;">Сохранить токен</button>
    </div>
    <p class="muted" id="tokenStatus"></p>
    <p id="globalStatus" class="muted"></p>
  </div>

  <!-- График TradingView -->
  <div class="card">
    <h2 style="font-size: 1.1rem; margin-top: 0; margin-bottom: 1rem;">График BTC/USDT (4H)</h2>
    <div id="tv_chart_container"></div>
  </div>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
// --- НАСТРОЙКИ ---
const OWNER  = 'youtumbashow-lab';   // Твой логин GitHub
const REPO   = '4h-macd-alert';      // Твой репозиторий
const BRANCH = 'main';
const CONFIG_PATH = 'bot_config.json';
const STATE_PATH  = 'bot_state.json';

const $ = id => document.getElementById(id);
const tokenKey = 'gh_pat_bot_dashboard';

// --- ИНИЦИАЛИЗАЦИЯ ГРАФИКА ---
function initChart() {
    new TradingView.widget({
        "autosize": true,
        "symbol": "BINANCE:BTCUSDT",
        "interval": "240", // 4 часа в минутах
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "ru",
        "toolbar_bg": "#f1f3f6",
        "enable_publishing": false,
        "hide_side_toolbar": false, // Включает панель инструментов (рисовалки)
        "allow_symbol_change": true,
        "container_id": "tv_chart_container",
        "studies": [
            "MASimple@tv-basicstudies"
        ]
    });
}

// --- РАБОТА С GITHUB API ---
function getToken() { return localStorage.getItem(tokenKey) || ''; }
function updateTokenStatus() {
    const t = getToken();
    $('tokenStatus').textContent = t ? `Токен сохранён (…${t.slice(-6)})` : 'Введите токен для управления.';
}

function saveToken() {
    const val = $('token').value.trim();
    if (!val) return;
    localStorage.setItem(tokenKey, val);
    $('token').value = '';
    updateTokenStatus();
    loadDashboard(); // Перезагружаем данные с новым токеном
}

async function getFile(path) {
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}&t=${Date.now()}`;
    const r = await fetch(url, { headers: { 'Authorization': `Bearer ${getToken()}` } });
    if (r.status === 404) return { sha: null, data: null };
    if (!r.ok) throw new Error(`Ошибка загрузки ${path}: ${r.status}`);
    const j = await r.json();
    const content = atob(j.content.replace(/\n/g, ''));
    return { sha: j.sha, data: JSON.parse(content) };
}

async function putFile(path, data, sha, message) {
    const body = {
        message,
        content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
        branch: BRANCH,
    };
    if (sha) body.sha = sha;
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(`Ошибка сохранения ${path}: ${r.status} ${await r.text()}`);
    return r.json();
}

// --- ЛОГИКА ДАШБОРДА ---
async function loadDashboard() {
    if (!getToken()) {
        $('botStatusBadge').textContent = 'Нет токена';
        $('botStatusBadge').className = 'status-badge status-inactive';
        return;
    }

    try {
        // Загружаем конфиг (вкл/выкл)
        const { data: cfg } = await getFile(CONFIG_PATH);
        const enabled = cfg ? cfg.enabled : false;
        
        const badge = $('botStatusBadge');
        if (enabled) {
            badge.textContent = 'Бот ВКЛЮЧЕН';
            badge.className = 'status-badge status-active';
            $('btnEnable').classList.add('btn-disabled');
            $('btnDisable').classList.remove('btn-disabled');
        } else {
            badge.textContent = 'Бот ВЫКЛЮЧЕН';
            badge.className = 'status-badge status-inactive';
            $('btnEnable').classList.remove('btn-disabled');
            $('btnDisable').classList.add('btn-disabled');
        }

        // Загружаем состояние (стратегию)
        const { data: state } = await getFile(STATE_PATH);
        if (state) {
            $('botInfo').style.display = 'block';
            $('infoState').textContent = state.status || '-';
            
            // Показываем уровень только если есть активный триггер
            if (state.trigger_high) {
                $('triggerInfo').style.display = 'block';
                $('infoLevel').textContent = state.trigger_high;
            } else {
                $('triggerInfo').style.display = 'none';
            }

            // Выводим активные сделки
            const tradesDiv = $('activeTradesList');
            if (state.active_trades && state.active_trades.length > 0) {
                tradesDiv.innerHTML = state.active_trades.map(t => `
                    <div style="background: #131722; padding: 0.8rem; border-radius: 4px; margin-bottom: 0.5rem; border-left: 3px solid ${t.breakeven ? '#089981' : '#f7a600'};">
                        <strong>Сделка от ${t.date}</strong><br>
                        Вход: ${t.entry_price} | Стоп: ${t.stop_loss} ${t.breakeven ? '(Безубыток)' : ''}
                    </div>
                `).join('');
            } else {
                tradesDiv.innerHTML = 'Нет активных сделок';
            }
            
            if (state.status.includes('WAITING')) {
                $('botStatusBadge').className = 'status-badge status-waiting';
            } else if (state.status === 'IN_TRADE') {
                $('botStatusBadge').className = 'status-badge status-active';
            }
        } else {
            $('botInfo').style.display = 'none';
        }

        $('globalStatus').textContent = 'Данные обновлены: ' + new Date().toLocaleTimeString();
        $('globalStatus').className = 'ok';

    } catch (e) {
        $('globalStatus').textContent = e.message;
        $('globalStatus').className = 'err';
    }
}

async function setBotState(enable) {
    if (!getToken()) return alert('Сначала введите токен!');
    
    const btn = enable ? $('btnEnable') : $('btnDisable');
    const originalText = btn.textContent;
    btn.textContent = 'Сохранение...';
    btn.disabled = true;

    try {
        const { sha } = await getFile(CONFIG_PATH);
        const newData = { enabled: enable };
        await putFile(CONFIG_PATH, newData, sha, enable ? 'Bot enabled via dashboard' : 'Bot disabled via dashboard');
        await loadDashboard(); // Перезагружаем UI
    } catch (e) {
        alert('Ошибка: ' + e.message);
    } finally {
        btn.textContent = originalText;
        btn.disabled = false;
    }
}

// --- СТАРТ ---
document.addEventListener('DOMContentLoaded', () => {
    initChart();
    updateTokenStatus();
    if (getToken()) loadDashboard();
});
</script>
</body>
</html>
