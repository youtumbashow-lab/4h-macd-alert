<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Breakout Bot Dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #131722; color: #d1d4dc; margin: 0; padding: 0.5rem; }
  .container { max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 1.3rem; color: #fff; margin: 0.5rem 0 1rem 0; text-align: center; }
  
  .card { background: #1e222d; border: 1px solid #2a2e39; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  
  button { padding: 0.8rem 1rem; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
  .btn-on { background: #089981; color: #fff; }
  .btn-on:active { background: #067a66; }
  .btn-off { background: #f23645; color: #fff; }
  .btn-off:active { background: #c42b38; }
  .btn-disabled { opacity: 0.4; pointer-events: none; }
  
  @media (max-width: 600px) {
    .btn-group { display: flex; flex-direction: column; gap: 0.5rem; width: 100%; margin-top: 1rem; }
    button { width: 100%; padding: 0.9rem; font-size: 1rem; }
    .row { justify-content: center; text-align: center; }
  }
  
  .status-badge { padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: inline-block; margin-top: 0.5rem; }
  .status-active { background: #08998133; color: #089981; border: 1px solid #089981; }
  .status-inactive { background: #f2364533; color: #f23645; border: 1px solid #f23645; }
  .status-waiting { background: #f7a60033; color: #f7a600; border: 1px solid #f7a600; }
  
  .info-grid { display: grid; grid-template-columns: 1fr; gap: 0.8rem; margin-top: 1rem; }
  @media (min-width: 600px) {
    .info-grid { grid-template-columns: 1fr 1fr; }
  }
  
  .info-item { background: #131722; padding: 0.8rem; border-radius: 4px; border: 1px solid #2a2e39; }
  .info-label { font-size: 0.75rem; color: #787b86; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .info-value { font-size: 1.1rem; font-weight: 600; color: #fff; }

  .charts-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-top: 1rem; }
  @media (min-width: 800px) {
    .charts-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 1200px) {
    .charts-grid { grid-template-columns: 1fr 1fr 1fr; }
  }

  .chart-container { 
    height: 400px; 
    width: 100%; 
    border-radius: 8px; 
    overflow: hidden; 
    border: 1px solid #2a2e39; 
    background: #131722;
  }
  @media (min-width: 800px) {
    .chart-container { height: 450px; }
  }
  
  .token-area { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
  @media (min-width: 600px) {
    .token-area { flex-direction: row; }
  }
  
  .token-area input { flex: 1; padding: 0.8rem; border-radius: 4px; border: 1px solid #2a2e39; background: #131722; color: #d1d4dc; font-size: 0.9rem; }
  
  .muted { color: #787b86; font-size: 0.85rem; text-align: center; margin-top: 0.5rem; }
  .err { color: #f23645; }
  .ok { color: #089981; }
  
  .trade-item { background: #131722; padding: 0.8rem; border-radius: 4px; margin-bottom: 0.5rem; border-left: 3px solid #f7a600; font-size: 0.9rem; }
  .trade-item.breakeven { border-left-color: #089981; }
</style>
</head>
<body>

<div class="container">
  <h1>Breakout Bot Dashboard</h1>

  <div class="card">
    <div class="row" style="justify-content: center; text-align: center;">
      <span style="font-size: 1rem; font-weight: 600;">Статус бота:</span>
      <span id="botStatusBadge" class="status-badge status-inactive">Загрузка...</span>
    </div>
    
    <div class="btn-group">
      <button id="btnEnable" class="btn-on" onclick="setBotState(true)">Включить бота</button>
      <button id="btnDisable" class="btn-off" onclick="setBotState(false)">Отключить бота</button>
    </div>
    
    <div id="botInfo" style="display: none; margin-top: 1rem;">
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">Текущий статус</div>
          <div class="info-value" id="infoState">-</div>
        </div>
        <div class="info-item" id="triggerInfo" style="display: none;">
          <div class="info-label">Хай триггера</div>
          <div class="info-value" id="infoLevel">-</div>
        </div>
      </div>
      
      <h3 style="margin-top: 1.5rem; font-size: 1rem; color: #fff; margin-bottom: 0.5rem;">Активные сделки:</h3>
      <div id="activeTradesList" class="muted" style="text-align: left;">Нет активных сделок</div>
    </div>
    
    <div class="token-area">
      <input id="token" type="password" placeholder="Fine-grained PAT (Contents: Read and write)">
      <button onclick="saveToken()" class="btn-on">Сохранить токен</button>
    </div>
    <p class="muted" id="tokenStatus"></p>
    <p id="globalStatus" class="muted"></p>
  </div>

  <div class="card">
    <h2 style="font-size: 1.1rem; margin-top: 0; margin-bottom: 1rem; text-align: center;">Рынки (4H)</h2>
    <div class="charts-grid" id="chartsGrid"></div>
  </div>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
const OWNER  = 'youtumbashow-lab';
const REPO   = '4h-macd-alert';
const BRANCH = 'main';
const CONFIG_PATH = 'bot_config.json';
const STATE_PATH  = 'bot_state.json';

const SYMBOLS = [
  "BINANCE:BTCUSDT", "BINANCE:ETHUSDT", "BINANCE:SOLUSDT",
  "BINANCE:TRUMPUSDT", "BINANCE:DOGEUSDT", "BINANCE:DOTUSDT",
  "BINANCE:TRXUSDT", "BINANCE:LTCUSDT", "BINANCE:STRKUSDT",
  "BINANCE:APTUSDT", "BINANCE:ADAUSDT"
];

const $ = id => document.getElementById(id);
const tokenKey = 'gh_pat_bot_dashboard';

function initCharts() {
    const grid = $('chartsGrid');
    grid.innerHTML = '';

    SYMBOLS.forEach((symbol, index) => {
        const div = document.createElement('div');
        div.className = 'chart-container';
        div.id = `tv_chart_${index}`;
        grid.appendChild(div);

        new TradingView.widget({
            "autosize": true,
            "symbol": symbol,
            "interval": "240", // 4h
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "ru",
            "enable_publishing": false,
            "hide_side_toolbar": true,
            "allow_symbol_change": false,
            "container_id": `tv_chart_${index}`,
            "studies": [
                "MAExp@tv-basicstudies",   // EMA
                "MACD@tv-basicstudies"     // MACD
            ]
        });
    });

    // Принудительное применение настроек через 2 секунды после загрузки
    setTimeout(() => {
        const tvWidgets = document.querySelectorAll('.tradingview-widget-container iframe');
        tvWidgets.forEach((iframe) => {
            try {
                // Отправляем команду внутрь iframe для изменения настроек
                iframe.contentWindow.postMessage({
                    name: 'apply_study_overrides',
                    overrides: {
                        // EMA 200
                        "moving average exponential.length": 200,
                        // MACD 12, 46, 9
                        "macd.fastLength": 12,
                        "macd.slowLength": 46,
                        "macd.signalLength": 9,
                        "macd.oscillatorMaType": "EMA",
                        "macd.signalMaType": "EMA"
                    }
                }, '*');
            } catch (e) {
                console.log("Не удалось применить настройки к iframe", e);
            }
        });
    }, 2000);
}

function getToken() { return localStorage.getItem(tokenKey) || ''; }
function updateTokenStatus() {
    const t = getToken();
    $('tokenStatus').textContent = t ? `Токен сохранён (…${t.slice(-6)})` : 'Введите токен для управления.';
}

function saveToken() {
    const val = $('token').value.trim();
    if (!val) return;
    localStorage.setItem(tokenKey, val);
    $('token').value = '';
    updateTokenStatus();
    loadDashboard();
}

async function getFile(path) {
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}&t=${Date.now()}`;
    const r = await fetch(url, { headers: { 'Authorization': `Bearer ${getToken()}` } });
    if (r.status === 404) return { sha: null, data: null };
    if (!r.ok) throw new Error(`Ошибка загрузки ${path}: ${r.status}`);
    const j = await r.json();
    const content = atob(j.content.replace(/\n/g, ''));
    return { sha: j.sha, data: JSON.parse(content) };
}

async function putFile(path, data, sha, message) {
    const body = {
        message,
        content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
        branch: BRANCH,
    };
    if (sha) body.sha = sha;
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(`Ошибка сохранения ${path}: ${r.status} ${await r.text()}`);
    return r.json();
}

async function loadDashboard() {
    if (!getToken()) {
        $('botStatusBadge').textContent = 'Нет токена';
        $('botStatusBadge').className = 'status-badge status-inactive';
        return;
    }

    try {
        const { data: cfg } = await getFile(CONFIG_PATH);
        const enabled = cfg ? cfg.enabled : false;
        
        const badge = $('botStatusBadge');
        if (enabled) {
            badge.textContent = 'ВКЛЮЧЕН';
            badge.className = 'status-badge status-active';
            $('btnEnable').classList.add('btn-disabled');
            $('btnDisable').classList.remove('btn-disabled');
        } else {
            badge.textContent = 'ВЫКЛЮЧЕН';
            badge.className = 'status-badge status-inactive';
            $('btnEnable').classList.remove('btn-disabled');
            $('btnDisable').classList.add('btn-disabled');
        }

        const { data: state } = await getFile(STATE_PATH);
        
        if (state && state.status) {
            $('botInfo').style.display = 'block';
            
            const statusMap = {
                "WAITING_NEXT_TRIGGER": "Ждет триггер (16:00)",
                "WAITING_BREAKOUT": "Ждет пробоя",
                "WAITING_RETEST": "Ждет ретеста",
                "IN_TRADE": "В сделке"
            };
            $('infoState').textContent = statusMap[state.status] || state.status;
            
            if (state.trigger_high) {
                $('triggerInfo').style.display = 'block';
                $('infoLevel').textContent = state.trigger_high;
            } else {
                $('triggerInfo').style.display = 'none';
            }

            const tradesDiv = $('activeTradesList');
            if (state.active_trades && state.active_trades.length > 0) {
                tradesDiv.innerHTML = state.active_trades.map(t => `
                    <div class="trade-item ${t.breakeven ? 'breakeven' : ''}">
                        <strong>Сделка от ${t.date}</strong><br>
                        Вход: ${t.entry_price} | Стоп: ${t.stop_loss} ${t.breakeven ? '(Безубыток)' : ''}
                    </div>
                `).join('');
            } else {
                tradesDiv.innerHTML = 'Нет активных сделок';
            }
            
            if (state.status.includes('WAITING')) {
                badge.classList.add('status-waiting');
            }
        } else {
            $('botInfo').style.display = 'block';
            $('infoState').textContent = 'Ожидание первого запуска бота';
            $('triggerInfo').style.display = 'none';
            $('activeTradesList').innerHTML = 'Нет активных сделок';
        }

        $('globalStatus').textContent = 'Обновлено: ' + new Date().toLocaleTimeString();
        $('globalStatus').className = 'ok';

    } catch (e) {
        $('globalStatus').textContent = e.message;
        $('globalStatus').className = 'err';
    }
}

async function setBotState(enable) {
    if (!getToken()) return alert('Сначала введите токен!');
    
    const btn = enable ? $('btnEnable') : $('btnDisable');
    const originalText = btn.textContent;
    btn.textContent = '...';
    btn.disabled = true;

    try {
        const { sha } = await getFile(CONFIG_PATH);
        const newData = { enabled: enable };
        await putFile(CONFIG_PATH, newData, sha, enable ? 'Bot enabled' : 'Bot disabled');
        await loadDashboard();
    } catch (e) {
        alert('Ошибка: ' + e.message);
    } finally {
        btn.textContent = originalText;
        btn.disabled = false;
    }
}

document.addEventListener('DOMContentLoaded', () => {
    initCharts();
    updateTokenStatus();
    if (getToken()) loadDashboard();
});
</script>
</body>
</html>
