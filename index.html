<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Alerts</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  .muted { opacity: .7; font-size: .9rem; }
  table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
  th, td { padding: .5rem .6rem; text-align: left; border-bottom: 1px solid #8884; }
  th { font-weight: 600; font-size: .85rem; opacity: .8; }
  input[type="number"] { width: 140px; padding: .35rem .5rem; }
  input[type="text"], select { padding: .35rem .5rem; }
  button { padding: .45rem .9rem; cursor: pointer; border-radius: 6px;
           border: 1px solid #8888; background: #8882; }
  button.primary { background: #2b7cff; color: #fff; border-color: #2b7cff; }
  button.danger { color: #d33; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .ok { color: #2a2; } .err { color: #d33; }
  label.toggle { display: inline-flex; gap: .35rem; align-items: center; }
  fieldset { border: 1px solid #8884; border-radius: 8px; padding: 1rem; }
  legend { padding: 0 .4rem; font-weight: 600; }
</style>
</head>
<body>

<h1>Price Alerts</h1>
<p class="muted">Одноразовые алерты «цена выше уровня» за 10 минут до закрытия 4h-свечи.
   После срабатывания алерт выключается — включи вручную, чтобы использовать снова.</p>

<fieldset style="margin-top:1.5rem">
  <legend>GitHub token</legend>
  <div class="row">
    <input id="token" type="password" placeholder="Fine-grained PAT (Contents: Read and write)"
           style="flex:1; min-width:280px">
    <button id="saveToken">Запомнить</button>
    <button id="forgetToken" class="danger">Забыть</button>
  </div>
  <p class="muted" id="tokenStatus"></p>
</fieldset>

<fieldset style="margin-top:1rem">
  <legend>Добавить алерт</legend>
  <div class="row">
    <select id="ticker"></select>
    <input id="above" type="number" step="any" placeholder="Цена выше…">
    <button id="addBtn" class="primary">Добавить</button>
  </div>
</fieldset>

<h2 style="font-size:1.1rem; margin-top:2rem">Алерты</h2>
<table>
  <thead>
    <tr>
      <th>Тикер</th><th>Условие</th><th>Вкл</th><th>ID</th><th></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<p id="status" class="muted"></p>

<script>
const OWNER  = 'youtumbashow-lab';
const REPO   = '4h-macd-alert';
const BRANCH = 'main';
const CONFIG_PATH = 'price_config.json';

const TICKERS = [
  'BTC-USD','TRUMP-USD','DOGE-USD','DOT-USD','TRX-USD',
  'ETH-USD','LTC-USD','STRK-USD','APT-USD'
];

const $ = id => document.getElementById(id);
const tokenKey = 'gh_pat_price_alerts';

$('ticker').innerHTML = TICKERS.map(t => `<option>${t}</option>`).join('');

function setStatus(msg, cls) {
  const el = $('status');
  el.textContent = msg;
  el.className = cls || 'muted';
}

function getToken() { return localStorage.getItem(tokenKey) || ''; }
function updateTokenStatus() {
  const t = getToken();
  $('tokenStatus').textContent = t
    ? `Токен сохранён (…${t.slice(-6)})`
    : 'Токен не задан — сохранение невозможно.';
}

$('saveToken').onclick = () => {
  const v = $('token').value.trim();
  if (!v) return;
  localStorage.setItem(tokenKey, v);
  $('token').value = '';
  updateTokenStatus();
};
$('forgetToken').onclick = () => {
  localStorage.removeItem(tokenKey);
  updateTokenStatus();
};

async function ghGetConfig() {
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${CONFIG_PATH}?ref=${BRANCH}&t=${Date.now()}`;
  const r = await fetch(url, {
    headers: { 
      'Authorization': `Bearer ${getToken()}`
    }
  });
  if (r.status === 404) return { sha: null, data: { timeframe: '4h', alerts: [] } };
  if (!r.ok) throw new Error(`GET ${r.status}: ${await r.text()}`);
  const j = await r.json();
  const content = atob(j.content.replace(/\n/g, ''));
  return { sha: j.sha, data: JSON.parse(content) };
}

async function ghPutConfig(data, sha, message) {
  const body = {
    message,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
    branch: BRANCH,
  };
  if (sha) body.sha = sha;
  const r = await fetch(
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${CONFIG_PATH}`,
    {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${getToken()}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    }
  );
  if (!r.ok) throw new Error(`PUT ${r.status}: ${await r.text()}`);
  return r.json();
}

function makeId(ticker, above) {
  return `${ticker.toLowerCase().replace(/[^a-z0-9]+/g, '-')}_${above}`;
}

function fmt(p) {
  if (p >= 1) return p.toFixed(2);
  if (p >= 0.01) return p.toFixed(4);
  return p.toString();
}

async function render() {
  const tbody = $('tbody');
  tbody.innerHTML = '<tr><td colspan="5" class="muted">Загрузка…</td></tr>';
  try {
    const { sha, data } = await ghGetConfig();
    window.__cfg = { sha, data };
    if (!data.alerts || data.alerts.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="muted">Пока нет алертов</td></tr>';
      return;
    }
    tbody.innerHTML = data.alerts.map(a => `
      <tr>
        <td>${a.ticker}</td>
        <td>&gt; ${fmt(a.above)}</td>
        <td>
          <label class="toggle">
            <input type="checkbox" data-id="${a.id}" ${a.enabled ? 'checked' : ''}
                   onchange="toggleAlert('${a.id}', this.checked)">
          </label>
        </td>
        <td class="muted">${a.id}</td>
        <td><button class="danger" onclick="deleteAlert('${a.id}')">Удалить</button></td>
      </tr>
    `).join('');
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="5" class="err">${e.message}</td></tr>`;
  }
}

async function commit(mutator, message) {
  setStatus('Синхронизация с GitHub…');
  try {
    const { sha, data } = await ghGetConfig();
    mutator(data);
    await ghPutConfig(data, sha, message);
    await render();
    setStatus('Сохранено', 'ok');
  } catch (e) {
    setStatus(e.message, 'err');
  }
}

$('addBtn').onclick = async () => {
  const ticker = $('ticker').value;
  const above = parseFloat($('above').value);
  if (!isFinite(above) || above <= 0) {
    setStatus('Введите корректную цену', 'err'); return;
  }
  const id = makeId(ticker, above);
  await commit(d => {
    const existing = d.alerts.find(a => a.id === id);
    if (existing) {
      existing.enabled = true;
      existing.above = above;
    } else {
      d.alerts.push({ id, ticker, above, enabled: true });
    }
  }, `add alert ${id}`);
  $('above').value = '';
};

async function toggleAlert(id, enabled) {
  await commit(d => {
    const a = d.alerts.find(x => x.id === id);
    if (a) a.enabled = enabled;
  }, `toggle ${id} -> ${enabled}`);
}

async function deleteAlert(id) {
  if (!confirm(`Удалить ${id}?`)) return;
  await commit(d => {
    d.alerts = d.alerts.filter(x => x.id !== id);
  }, `delete ${id}`);
}

updateTokenStatus();
if (getToken()) render();
else setStatus('Введи PAT выше, чтобы загрузить алерты', 'muted');
</script>
</body>
</html>
